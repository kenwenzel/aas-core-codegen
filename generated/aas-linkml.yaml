    SpecificAssetId:
        description: "A specific asset ID describes a generic supplementary identifying attribute of the asset."
        is_a: HasSemantics
        attributes:
            externalSubjectId:
                description: "The (external) subject the key belongs to or has meaning to."
                range: Reference
                required: true
            name:
                description: "Name of the identifier"
                range: string
                required: true
            value:
                description: "The value of the specific asset identifier with the corresponding name."
                range: string
                required: true

    Submodel:
        description: "A submodel defines a specific aspect of the asset represented by the AAS."
        mixins:
                - Identifiable
                - HasKind
                - HasSemantics
                - Qualifiable
                - HasDataSpecification
        attributes:
            submodelElements:
                description: "A submodel consists of zero or more submodel elements."
                range: SubmodelElement
                multivalued: true

    SubmodelElement:
        abstract: true
        description: "A submodel element is an element suitable for the description and differentiation of assets."
        mixins:
                - Referable
                - HasKind
                - HasSemantics
                - Qualifiable
                - HasDataSpecification

    SubmodelElementCollection:
        description: "A submodel element collection is a kind of struct, i.e. a a logical encapsulation of multiple named values. It has a fixed number of submodel elements."
        is_a: SubmodelElement
        attributes:
            value:
                description: "Submodel element contained in the collection."
                range: SubmodelElement
                multivalued: true

    SubmodelElementList:
        description: "A submodel element list is an ordered list of submodel elements."
        is_a: SubmodelElement
        attributes:
            orderRelevant:
                description: "Defines whether order in list is relevant. If 'orderRelevant' = False then the list is representing a set or a bag."
                range: boolean
            semanticIdListElement:
                description: "Semantic ID the submodel elements contained in the list match to."
                range: Reference
            typeValueListElement:
                description: "The submodel element type of the submodel elements contained in the list."
                range: AasSubmodelElements
                required: true
            value:
                description: "Submodel element contained in the list."
                range: SubmodelElement
                multivalued: true
            valueTypeListElement:
                description: "The value type of the submodel element contained in the list."
                range: DataTypeDefXsd

    ValueList:
        description: "A set of value reference pairs."
        attributes:
            valueReferencePairs:
                description: "A pair of a value together with its global unique id."
                range: ValueReferencePair
                required: true
                multivalued: true

    ValueReferencePair:
        description: "A value reference pair within a value list. Each value has a global unique id defining its semantic."
        attributes:
            value:
                description: "The value of the referenced concept definition of the value in valueId."
                range: string
                required: true
            valueId:
                description: "Global unique id of the value."
                range: Reference
                required: true
